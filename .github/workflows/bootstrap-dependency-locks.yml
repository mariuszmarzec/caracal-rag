name: Generate dependency lock files (bootstrap)

on:
  push:
    branches:
      - assistant/issue-22-dependency-locks
    paths:
      - tools/refresh-dependencies.sh

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            python-tag: "310"
          - python-version: "3.11"
            python-tag: "311"
          - python-version: "3.12"
            python-tag: "312"
          - python-version: "3.13"
            python-tag: "313"
          - python-version: "3.14"
            python-tag: "314"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Generate pinned dependency constraints
        run: bash tools/refresh-dependencies.sh --python "${{ matrix.python-version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: constraints-py${{ matrix.python-tag }}.lock
          path: constraints-py${{ matrix.python-tag }}.lock
          if-no-files-found: error

  commit-locks:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: constraints-py*.lock
          path: ${{ runner.temp }}/lock-files
          merge-multiple: true
      - name: Commit generated locks to this branch
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}"/lock-files/constraints-py*.lock .
          git add constraints-py*.lock
          if git diff --cached --quiet; then
            echo "No dependency lock changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: pin dependency graph for supported Python versions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
