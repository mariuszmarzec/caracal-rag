[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caracal-rag"
version = "0.1.0"
description = "Caracal RAG - retrieval-augmented generation toolkit (project skeleton)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mariusz Marzec" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
